version: "3.9"

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    # Sem portas expostas — bot Discord não precisa de servidor HTTP

networks:
  default:
    name: discord-bot-net
