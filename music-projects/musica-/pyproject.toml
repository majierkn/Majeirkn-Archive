[build-system]
requires=["hatchling"]
build-backend="hatchling.build"
[project]
name="discord-music-bot"
version="1.0.0"
description="Bot de música Discord moderno em Python"
requires-python=">=3.10"
dependencies=["discord.py>=2.7.1","yt-dlp[default]>=2026.0","PyNaCl>=1.5","python-dotenv>=1.1","pydantic>=2.10","pydantic-settings>=2.7","aiosqlite>=0.20","cachetools>=5.5","structlog>=25.1"]
[project.optional-dependencies]
dev=["pytest>=8.0","pytest-asyncio>=0.25","ruff>=0.11","mypy>=1.15"]
[tool.ruff]
line-length=120
target-version="py310"
[tool.pytest.ini_options]
asyncio_mode="auto"
